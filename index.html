<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2E8F8F; --teal-dark:#237272; --teal-bg:#E4F2F2;
  --rose:#E05C6E; --rose-bg:#FBE9EC;
  --green:#2FA36B; --green-bg:#E3F3EB;
  --amber:#E39B2D; --amber-bg:#FBF1DF;
  --ink:#2B3A3A; --ink-soft:#6B7C7C;
  --bg:#F7FAFA; --card:#FFFFFF; --line:#E2ECEC;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;padding-bottom:60px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--teal);color:#fff;padding:16px 20px 14px;border-radius:0 0 18px 18px}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px}
.mnav button{background:rgba(255,255,255,.18);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;font-family:inherit}
.mnav h1{font-size:20px;font-weight:700}
.summary{display:flex;gap:8px;margin-top:14px}
.sum-card{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.sum-card .lb{font-size:11px;opacity:.85}
.sum-card .vl{font-size:15px;font-weight:700;margin-top:2px}

.tabs{display:flex;gap:5px;padding:14px 14px 6px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:#fff;border:1px solid var(--line);cursor:pointer}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}

.page{display:none;padding:10px 14px}
.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h2::before{content:"";width:4px;height:14px;background:var(--teal);border-radius:2px}
.hint{font-size:11px;color:var(--ink-soft);margin:-6px 0 10px}
.empty{font-size:12px;color:var(--ink-soft);text-align:center;padding:16px 0}

/* 입력 */
.toggle{display:flex;gap:8px;margin-bottom:14px}
.tg{flex:1;padding:11px 0;text-align:center;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft)}
.tg.exp.on{background:var(--rose-bg);border-color:var(--rose);color:var(--rose)}
.tg.inc.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.frow input,.frow select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#FCFEFE}
.frow input:focus,.frow select:focus{outline:2px solid var(--teal-bg);border-color:var(--teal)}
.frow2{display:flex;gap:10px}
.frow2 .frow{flex:1}
.savebtn{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
.savebtn:active{background:var(--teal-dark)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

/* 예산 바 */
.brow{margin-bottom:13px;cursor:pointer}
.brow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.brow .name{font-weight:600}
.brow .amt{color:var(--ink-soft)}
.brow .amt b{color:var(--ink)}
.bar{height:8px;background:#EEF4F4;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.ok i{background:var(--green)} .warn i{background:var(--amber)} .over i{background:var(--rose)}
.mark{font-size:12px;font-weight:700}
.ok .mark{color:var(--green)} .warn .mark{color:var(--amber)} .over .mark{color:var(--rose)}
.over .name{color:var(--rose)}

/* 캘린더 */
.cal{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
.cal th{color:var(--ink-soft);font-weight:600;font-size:10px;padding:4px 0}
.cal th.wk{width:21%;background:var(--teal-bg);border-radius:6px 6px 0 0;color:var(--teal-dark)}
.cal td{border:1px solid var(--line);vertical-align:top;padding:3px 2px;height:44px}
.cal td .dy{font-size:9px;color:var(--ink-soft);font-weight:600}
.cal td .e{color:var(--rose);font-weight:600;display:block;line-height:1.3}
.cal td .i{color:var(--green);font-weight:600;display:block;line-height:1.3}
.cal td.today{background:var(--teal-bg);border-color:var(--teal)}
.cal td.today .dy{color:var(--teal-dark)}
.cal td.wksum{background:#F2F8F8;padding:4px 4px}
.cal td.wksum .wl{font-size:9px;color:var(--ink-soft)}
.cal td.wksum .wi{color:var(--green);font-weight:700;display:block;line-height:1.4}
.cal td.wksum .we{color:var(--rose);font-weight:700;display:block;line-height:1.4}
.cal td.dim{background:#FBFDFD}

/* 월별 흐름 */
.chart{display:flex;align-items:flex-end;gap:7px;height:110px;padding-top:8px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.cb .cols{display:flex;gap:2px;align-items:flex-end;height:80px;width:100%;justify-content:center}
.cb .in{width:9px;background:var(--green);border-radius:3px 3px 0 0;opacity:.85}
.cb .out{width:9px;background:var(--rose);border-radius:3px 3px 0 0;opacity:.85}
.cb .m{font-size:10px;color:var(--ink-soft)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--ink-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px}

/* 도넛 */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#EEF4F4}
.donut .hole{width:76px;height:76px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .hole .t{font-size:10px;color:var(--ink-soft)}
.donut .hole .v{font-size:14px;font-weight:700}
.dlegend{flex:1;font-size:12px}
.dlegend .dl{display:flex;justify-content:space-between;padding:3px 0}
.dlegend .pct{color:var(--ink-soft);font-weight:600}

/* 손익표 */
table.pl{width:100%;border-collapse:collapse;font-size:12.5px}
table.pl th{background:var(--teal);color:#fff;padding:8px 6px;font-weight:600;font-size:12px}
table.pl th:first-child{border-radius:8px 0 0 0;text-align:left;padding-left:10px}
table.pl th:last-child{border-radius:0 8px 0 0}
table.pl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.pl td:first-child{text-align:left;padding-left:10px;font-weight:500}
table.pl tr.sec td{background:var(--teal-bg);font-weight:700;border-bottom:none}
table.pl .neg{color:var(--rose);font-weight:600}
table.pl .pos{color:var(--green)}
table.pl tr.total td{background:#EFF6F6;font-weight:700;border-top:2px solid var(--teal);border-bottom:none}

/* 리스트/드릴다운 */
.trow{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.trow:last-child{border:none}
.trow .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.chip.exp{background:var(--rose-bg);color:var(--rose)}
.chip.inc{background:var(--green-bg);color:var(--green)}
.trow .money{font-weight:600;white-space:nowrap}
.trow .money.exp{color:var(--rose)} .trow .money.inc{color:var(--green)}
.del{background:none;border:none;color:#B9C8C8;font-size:15px;cursor:pointer;padding:2px 6px;font-family:inherit}
.back{font-size:12px;color:var(--teal);font-weight:600;cursor:pointer;margin-bottom:10px;display:inline-block}
.crumb{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.crumb b{color:var(--teal)}

/* 예산 설정 */
.setrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border:none}
.setrow .nm{flex:1;font-size:13px;font-weight:500}
.setrow input{width:120px;text-align:right;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#FCFEFE}
.setrow input:focus{outline:2px solid var(--teal-bg);border-color:var(--teal)}
.won{font-size:12px;color:var(--ink-soft)}
.syncbadge{font-size:10px;color:var(--ink-soft);text-align:center;padding:6px 0 0}
</style>
</head>
<body>

<header>
  <div class="mnav">
    <button onclick="moveMonth(-1)">‹</button>
    <h1 id="monthTitle">2026년 7월</h1>
    <button onclick="moveMonth(1)">›</button>
  </div>
  <div class="summary">
    <div class="sum-card"><div class="lb">수입</div><div class="vl num" id="sumIn">0</div></div>
    <div class="sum-card"><div class="lb">지출</div><div class="vl num" id="sumOut">0</div></div>
    <div class="sum-card"><div class="lb">남은 돈</div><div class="vl num" id="sumLeft">0</div></div>
  </div>
</header>

<div class="tabs">
  <div class="tab on" data-p="0" onclick="go(0,this)">✏️ 입력</div>
  <div class="tab" data-p="1" onclick="go(1,this)">대시보드</div>
  <div class="tab" data-p="2" onclick="go(2,this)">상세 분석</div>
  <div class="tab" data-p="3" onclick="go(3,this)">예산 설정</div>
</div>

<!-- ⓪ 입력 -->
<div class="page on" id="p0">
  <div class="card">
    <h2>내역 입력</h2>
    <div class="toggle">
      <div class="tg exp on" id="tgExp" onclick="tgSel('지출')">− 지출</div>
      <div class="tg inc" id="tgInc" onclick="tgSel('수입')">＋ 수입</div>
    </div>
    <div class="frow2">
      <div class="frow"><label>날짜</label><input type="date" id="inDate"></div>
      <div class="frow"><label>금액</label><input type="text" class="num" id="inAmt" placeholder="25,000" inputmode="numeric"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label>대분류</label><select id="bigCat" onchange="syncSub()"></select></div>
      <div class="frow" id="subWrap"><label>소분류</label><select id="subCat"></select></div>
    </div>
    <div class="frow"><label>비고 (메모)</label><input type="text" id="inMemo" placeholder="예: 치킨"></div>
    <button class="savebtn" onclick="saveEntry()">저장하기</button>
  </div>

  <div class="card">
    <h2>이번 달 최근 내역</h2>
    <div id="recentList"></div>
  </div>
  <div class="syncbadge" id="syncBadge"></div>
</div>

<!-- ① 대시보드 -->
<div class="page" id="p1">
  <div class="card">
    <h2>이번 달 예산 현황</h2>
    <div class="hint">항목을 누르면 상세 분석으로 이동해요</div>
    <div id="budgetBars"></div>
  </div>

  <div class="card">
    <h2 id="calTitle">캘린더</h2>
    <div class="hint">날짜별 수입·지출 + 오른쪽에 주간 합계</div>
    <table class="cal" id="calTable"></table>
  </div>

  <div class="card">
    <h2>월별 흐름</h2>
    <div class="chart" id="flowChart"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--green)"></i>수입</span>
      <span><i class="dot" style="background:var(--rose)"></i>지출</span>
    </div>
  </div>
</div>

<!-- ② 상세 분석 -->
<div class="page" id="p2">
  <div class="card">
    <h2>지출 구성 비율</h2>
    <div class="donut-wrap">
      <div class="donut" id="donut"><div class="hole"><span class="t">총 지출</span><span class="v num" id="donutTotal">0</span></div></div>
      <div class="dlegend" id="donutLegend"></div>
    </div>
  </div>

  <div class="card">
    <h2>이번 달 손익표</h2>
    <div class="hint">금액 · 예산 · 차이를 한 표로</div>
    <table class="pl" id="plTable"></table>
  </div>

  <div class="card" id="drillCard">
    <h2>드릴다운 분석</h2>
    <div class="hint">항목을 눌러서 파고들기!</div>
    <div id="drillBody"></div>
  </div>
</div>

<!-- ③ 예산 설정 -->
<div class="page" id="p3">
  <div class="card">
    <h2>대분류별 예산 설정</h2>
    <div class="hint">예산을 정하면 대시보드에 색상 경고가 떠요 (✓ 여유 · △ 80% 이상 · ✗ 초과)</div>
    <div id="budgetSettings"></div>
    <button class="savebtn" onclick="saveBudgets()">예산 저장하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ▼▼▼ Firebase 설정: 기기 간 동기화를 쓰려면 아래 firebaseConfig에 본인 설정을 붙여넣으세요 ▼▼▼ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "여기에_붙여넣기",
  authDomain: "여기에_붙여넣기",
  databaseURL: "여기에_붙여넣기",
  projectId: "여기에_붙여넣기",
  storageBucket: "여기에_붙여넣기",
  messagingSenderId: "여기에_붙여넣기",
  appId: "여기에_붙여넣기"
};
</script>
<!-- ▲▲▲ 여기까지 ▲▲▲ -->

<script>
/* ===== 카테고리 정의 ===== */
const CATS = {
  '지출': {
    '식비': ['식재료','외식','카페/간식','간편식','배달'],
    '대출금': [],
    '나': ['의류비','미용비','교육비','유흥비','홍어'],
    '현우': ['의류비','미용비','교육비','장난감'],
    '저축': [],
    '병원비': [],
    '사교비': ['회사','친구','현우친구'],
    '통신비': [],
    '정기구독': [],
    '소삼이': []
  },
  '수입': { '월급': [], '지원금': [], '기타': [] }
};
const EXP_BIGS = Object.keys(CATS['지출']);
const INC_BIGS = Object.keys(CATS['수입']);
const DONUT_COLORS = ['#E05C6E','#F0A3B0','#E39B2D','#2E8F8F','#8FBFBF','#6B7CC0','#C9D8D8'];

/* ===== 상태 ===== */
const KEY = 'budget_teal_v1';
let state = { transactions: [], budgets: {} };
let curType = '지출';
let viewY, viewM; // 보고 있는 달
let drillLevel = 1, drillBig = null, drillSub = null;

/* ===== 유틸 ===== */
const fmt = n => (n<0?'-':'') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtC = n => { // 캘린더용 축약
  const a = Math.abs(n);
  if(a >= 1000000) return (n/10000).toFixed(0)+'만';
  if(a >= 10000) return (Math.round(n/1000)/10)+'만';
  return fmt(n);
};
const pad = n => String(n).padStart(2,'0');
const ym = (y,m) => `${y}-${pad(m)}`;
function monthTx(y,m){ return state.transactions.filter(t=>t.date && t.date.startsWith(ym(y,m))); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

/* ===== Firebase / 저장 ===== */
let db = null;
try{
  if(firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('붙여넣')){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }
}catch(e){ console.warn('Firebase 초기화 실패:', e); }

let applyingRemote = false;
function loadState(){
  const local = localStorage.getItem(KEY);
  if(local){ try{ state = JSON.parse(local); }catch(e){} }
  if(!state.transactions) state.transactions = [];
  if(!state.budgets) state.budgets = {};
  if(db){
    db.ref('budgetApp').on('value', snap=>{
      const v = snap.val();
      if(v){
        applyingRemote = true;
        state = { transactions: v.transactions ? Object.values(v.transactions) : [], budgets: v.budgets || {} };
        localStorage.setItem(KEY, JSON.stringify(state));
        renderAll();
        applyingRemote = false;
      }
      setSyncBadge(true);
    }, err=>{ console.warn(err); setSyncBadge(false); });
  } else setSyncBadge(false);
}
function persist(){
  localStorage.setItem(KEY, JSON.stringify(state));
  if(db && !applyingRemote){
    db.ref('budgetApp').set({ transactions: state.transactions, budgets: state.budgets });
  }
  renderAll();
}
function setSyncBadge(on){
  document.getElementById('syncBadge').textContent = on ? '☁️ 클라우드 동기화 중' : '📱 이 기기에만 저장 중 (Firebase 설정 시 기기 간 동기화)';
}

/* ===== 탭 ===== */
function go(i,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  (el || document.querySelector(`.tab[data-p="${i}"]`)).classList.add('on');
  document.getElementById('p'+i).classList.add('on');
}

/* ===== 월 이동 ===== */
function moveMonth(d){
  viewM += d;
  if(viewM<1){viewM=12;viewY--;} if(viewM>12){viewM=1;viewY++;}
  drillLevel=1; drillBig=null; drillSub=null;
  renderAll();
}

/* ===== 입력 ===== */
function tgSel(type){
  curType = type;
  document.getElementById('tgExp').classList.toggle('on', type==='지출');
  document.getElementById('tgInc').classList.toggle('on', type==='수입');
  fillBig();
}
function fillBig(){
  const big = document.getElementById('bigCat');
  big.innerHTML = Object.keys(CATS[curType]).map(x=>`<option>${x}</option>`).join('');
  syncSub();
}
function syncSub(){
  const big = document.getElementById('bigCat').value;
  const subs = CATS[curType][big] || [];
  const wrap = document.getElementById('subWrap');
  const sub = document.getElementById('subCat');
  if(subs.length===0){ wrap.style.display='none'; sub.innerHTML=''; }
  else { wrap.style.display='block'; sub.innerHTML = subs.map(x=>`<option>${x}</option>`).join(''); }
}
document.getElementById('inAmt').addEventListener('input', e=>{
  const raw = e.target.value.replace(/[^0-9]/g,'');
  e.target.value = raw ? Number(raw).toLocaleString() : '';
});
function saveEntry(){
  const date = document.getElementById('inDate').value;
  const amt = Number(document.getElementById('inAmt').value.replace(/[^0-9]/g,''));
  const big = document.getElementById('bigCat').value;
  const subEl = document.getElementById('subCat');
  const sub = document.getElementById('subWrap').style.display==='none' ? '' : subEl.value;
  const memo = document.getElementById('inMemo').value.trim();
  if(!date){ toast('날짜를 선택해주세요'); return; }
  if(!amt){ toast('금액을 입력해주세요'); return; }
  state.transactions.push({ id: Date.now()+''+Math.floor(Math.random()*1000), date, type: curType, big, sub, amount: amt, memo });
  document.getElementById('inAmt').value='';
  document.getElementById('inMemo').value='';
  // 입력한 날짜의 달로 화면 이동
  viewY = Number(date.slice(0,4)); viewM = Number(date.slice(5,7));
  persist();
  toast('저장했어요! ✓');
}
function delEntry(id){
  if(!confirm('이 내역을 삭제할까요?')) return;
  state.transactions = state.transactions.filter(t=>t.id!==id);
  persist();
  toast('삭제했어요');
}

/* ===== 렌더링 ===== */
function renderAll(){
  document.getElementById('monthTitle').textContent = `${viewY}년 ${viewM}월`;
  document.getElementById('calTitle').textContent = `${viewM}월 캘린더`;
  const tx = monthTx(viewY, viewM);
  const inc = tx.filter(t=>t.type==='수입').reduce((s,t)=>s+t.amount,0);
  const out = tx.filter(t=>t.type==='지출').reduce((s,t)=>s+t.amount,0);
  document.getElementById('sumIn').textContent = fmt(inc);
  document.getElementById('sumOut').textContent = fmt(out);
  document.getElementById('sumLeft').textContent = (inc-out>=0?'+':'')+fmt(inc-out);
  renderRecent(tx);
  renderBars(tx);
  renderCalendar();
  renderFlow();
  renderDonut(tx);
  renderPL(tx, inc, out);
  renderDrill(tx);
  renderBudgetSettings();
}

function renderRecent(tx){
  const el = document.getElementById('recentList');
  const list = [...tx].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0,10);
  if(list.length===0){ el.innerHTML = '<div class="empty">아직 입력한 내역이 없어요</div>'; return; }
  el.innerHTML = list.map(t=>{
    const isE = t.type==='지출';
    const label = t.sub ? `${t.big}·${t.sub}` : t.big;
    return `<div class="trow">
      <span class="l"><span style="color:var(--ink-soft);font-size:12px">${Number(t.date.slice(5,7))}/${Number(t.date.slice(8,10))}</span>
      <span class="chip ${isE?'exp':'inc'}">${label}</span>${t.memo||''}</span>
      <span style="display:flex;align-items:center;gap:2px">
        <span class="money ${isE?'exp':'inc'} num">${isE?'-':'+'}${fmt(t.amount)}</span>
        <button class="del" onclick="delEntry('${t.id}')">✕</button>
      </span></div>`;
  }).join('');
}

function renderBars(tx){
  const el = document.getElementById('budgetBars');
  const rows = EXP_BIGS.map(big=>{
    const spent = tx.filter(t=>t.type==='지출'&&t.big===big).reduce((s,t)=>s+t.amount,0);
    const bud = Number(state.budgets[big]||0);
    return {big, spent, bud};
  }).filter(r=>r.bud>0 || r.spent>0);
  if(rows.length===0){ el.innerHTML='<div class="empty">예산 설정 탭에서 예산을 정하거나, 지출을 입력하면 여기에 표시돼요</div>'; return; }
  rows.sort((a,b)=>{
    const ra = a.bud? a.spent/a.bud : 0, rb = b.bud? b.spent/b.bud : 0;
    return rb-ra;
  });
  el.innerHTML = rows.map(r=>{
    let cls='ok', mark='✓', w=0;
    if(r.bud>0){
      const ratio = r.spent/r.bud;
      w = Math.min(100, ratio*100);
      if(ratio>=1){cls='over';mark='✗ 초과!';}
      else if(ratio>=0.8){cls='warn';mark='△ '+Math.round(ratio*100)+'%';}
    } else { w = 100; cls='ok'; mark=''; }
    const amtHtml = r.bud>0 ? `<b>${fmt(r.spent)}</b> / ${fmt(r.bud)}` : `<b>${fmt(r.spent)}</b> / 예산 없음`;
    return `<div class="brow ${cls}" onclick="drillTo('${r.big}')">
      <div class="top"><span class="name">${r.big} <span class="mark">${mark}</span></span>
      <span class="amt num">${amtHtml}</span></div>
      <div class="bar"><i style="width:${w}%${r.bud>0?'':';background:#C9D8D8'}"></i></div></div>`;
  }).join('');
}

function renderCalendar(){
  const first = new Date(viewY, viewM-1, 1);
  const daysIn = new Date(viewY, viewM, 0).getDate();
  const startDow = first.getDay();
  const today = new Date();
  const isThisMonth = today.getFullYear()===viewY && (today.getMonth()+1)===viewM;
  // 일별 합계
  const daily = {};
  monthTx(viewY,viewM).forEach(t=>{
    const d = Number(t.date.slice(8,10));
    if(!daily[d]) daily[d]={i:0,e:0};
    if(t.type==='수입') daily[d].i+=t.amount; else daily[d].e+=t.amount;
  });
  let html = '<tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th class="wk">주간 합계</th></tr>';
  let day = 1, week = 1;
  while(day <= daysIn){
    let row = '', wi=0, we=0;
    for(let dow=0; dow<7; dow++){
      const cellIdx = (week-1)*7 + dow;
      if(cellIdx < startDow || day > daysIn){ row += '<td class="dim"></td>'; }
      else{
        const d = daily[day];
        const tdCls = (isThisMonth && day===today.getDate()) ? ' class="today"' : '';
        let inner = `<span class="dy">${day}</span>`;
        if(d){
          if(d.i>0){ inner += `<span class="i num">+${fmtC(d.i)}</span>`; wi+=d.i; }
          if(d.e>0){ inner += `<span class="e num">-${fmtC(d.e)}</span>`; we+=d.e; }
        }
        row += `<td${tdCls}>${inner}</td>`;
        day++;
      }
    }
    row += `<td class="wksum"><span class="wl">${week}주차</span><span class="wi num">+${fmtC(wi)}</span><span class="we num">-${fmtC(we)}</span></td>`;
    html += `<tr>${row}</tr>`;
    week++;
  }
  document.getElementById('calTable').innerHTML = html;
}

function renderFlow(){
  const el = document.getElementById('flowChart');
  const months = [];
  for(let k=4;k>=0;k--){
    let y=viewY, m=viewM-k;
    while(m<1){m+=12;y--;}
    const tx = monthTx(y,m);
    months.push({
      m, y,
      i: tx.filter(t=>t.type==='수입').reduce((s,t)=>s+t.amount,0),
      e: tx.filter(t=>t.type==='지출').reduce((s,t)=>s+t.amount,0)
    });
  }
  const max = Math.max(1, ...months.map(x=>Math.max(x.i,x.e)));
  el.innerHTML = months.map(x=>`<div class="cb">
    <div class="cols"><i class="in" style="height:${Math.round(x.i/max*80)}px"></i><i class="out" style="height:${Math.round(x.e/max*80)}px"></i></div>
    <span class="m">${x.m}월</span></div>`).join('');
}

function renderDonut(tx){
  const byBig = EXP_BIGS.map(big=>({big, v: tx.filter(t=>t.type==='지출'&&t.big===big).reduce((s,t)=>s+t.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const total = byBig.reduce((s,x)=>s+x.v,0);
  document.getElementById('donutTotal').textContent = total>=10000 ? Math.round(total/10000)+'만' : fmt(total);
  const legend = document.getElementById('donutLegend');
  const donut = document.getElementById('donut');
  if(total===0){
    donut.style.background='#EEF4F4';
    legend.innerHTML='<div class="empty">이번 달 지출이 없어요</div>';
    return;
  }
  const top = byBig.slice(0,6);
  const rest = byBig.slice(6).reduce((s,x)=>s+x.v,0);
  const items = rest>0 ? [...top, {big:'기타', v:rest}] : top;
  let acc=0; const stops=[];
  items.forEach((x,i)=>{
    const from = acc/total*100; acc+=x.v;
    const to = acc/total*100;
    stops.push(`${DONUT_COLORS[i%DONUT_COLORS.length]} ${from}% ${to}%`);
  });
  donut.style.background = `conic-gradient(${stops.join(',')})`;
  legend.innerHTML = items.map((x,i)=>`<div class="dl"><span><i class="dot" style="background:${DONUT_COLORS[i%DONUT_COLORS.length]}"></i>${x.big}</span><span class="pct num">${Math.round(x.v/total*100)}%</span></div>`).join('');
}

function renderPL(tx, inc, out){
  const rows = [];
  rows.push(`<tr><th>항목</th><th>금액</th><th>예산</th><th>차이</th></tr>`);
  rows.push(`<tr class="sec"><td>수입</td><td class="num">${fmt(inc)}</td><td>-</td><td>-</td></tr>`);
  INC_BIGS.forEach(big=>{
    const v = tx.filter(t=>t.type==='수입'&&t.big===big).reduce((s,t)=>s+t.amount,0);
    if(v>0) rows.push(`<tr><td>${big}</td><td class="num">${fmt(v)}</td><td>-</td><td>-</td></tr>`);
  });
  const budTotal = EXP_BIGS.reduce((s,b)=>s+Number(state.budgets[b]||0),0);
  const outDiff = budTotal - out;
  rows.push(`<tr class="sec"><td>지출</td><td class="num">${fmt(out)}</td><td class="num">${budTotal?fmt(budTotal):'-'}</td><td class="num ${outDiff<0?'neg':'pos'}">${budTotal?(outDiff<0?fmt(outDiff)+' ✗':'+'+fmt(outDiff)+' ✓'):'-'}</td></tr>`);
  EXP_BIGS.forEach(big=>{
    const v = tx.filter(t=>t.type==='지출'&&t.big===big).reduce((s,t)=>s+t.amount,0);
    const bud = Number(state.budgets[big]||0);
    if(v===0 && bud===0) return;
    const diff = bud - v;
    const diffHtml = bud ? `<td class="num ${diff<0?'neg':'pos'}">${diff<0?fmt(diff)+' ✗':'+'+fmt(diff)+' ✓'}</td>` : '<td>-</td>';
    rows.push(`<tr><td>${big}</td><td class="num">${fmt(v)}</td><td class="num">${bud?fmt(bud):'-'}</td>${diffHtml}</tr>`);
  });
  rows.push(`<tr class="total"><td>남은 돈</td><td class="num">${fmt(inc-out)}</td><td>-</td><td>-</td></tr>`);
  document.getElementById('plTable').innerHTML = rows.join('');
}

/* ===== 드릴다운 ===== */
function drillTo(big){
  go(2);
  drillBig = big; drillSub = null;
  drillLevel = (CATS['지출'][big]||[]).length>0 ? 2 : 3;
  renderDrill(monthTx(viewY,viewM));
  document.getElementById('drillCard').scrollIntoView({behavior:'smooth'});
}
function drillBack(lv){
  drillLevel = lv;
  if(lv===1){ drillBig=null; drillSub=null; }
  if(lv===2){ drillSub=null; }
  renderDrill(monthTx(viewY,viewM));
}
function drillSubTo(sub){
  drillSub = sub; drillLevel = 3;
  renderDrill(monthTx(viewY,viewM));
}
function renderDrill(tx){
  const el = document.getElementById('drillBody');
  const exp = tx.filter(t=>t.type==='지출');
  if(drillLevel===1){
    const byBig = EXP_BIGS.map(big=>({big, v: exp.filter(t=>t.big===big).reduce((s,t)=>s+t.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    if(byBig.length===0){ el.innerHTML='<div class="empty">이번 달 지출이 없어요</div>'; return; }
    el.innerHTML = byBig.map(x=>{
      const bud = Number(state.budgets[x.big]||0);
      const over = bud>0 && x.v>=bud;
      return `<div class="trow" style="cursor:pointer" onclick="drillTo('${x.big}')">
        <span class="l">${over?'<span class="chip exp">초과</span>':''}${x.big}</span>
        <span class="money ${over?'exp':''} num">${fmt(x.v)} ›</span></div>`;
    }).join('');
  }
  else if(drillLevel===2){
    const subs = CATS['지출'][drillBig]||[];
    const total = exp.filter(t=>t.big===drillBig).reduce((s,t)=>s+t.amount,0);
    const bySub = subs.map(sub=>({sub, v: exp.filter(t=>t.big===drillBig&&t.sub===sub).reduce((s,t)=>s+t.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    el.innerHTML = `<span class="back" onclick="drillBack(1)">‹ 전체 지출로</span>
      <div class="crumb">지출 › <b>${drillBig}</b> — 소분류별</div>` +
      (bySub.length===0 ? '<div class="empty">내역이 없어요</div>' :
      bySub.map(x=>{
        const pct = total? Math.round(x.v/total*100):0;
        return `<div class="trow" style="cursor:pointer" onclick="drillSubTo('${x.sub}')">
          <span class="l"><span class="chip exp">${pct}%</span>${x.sub}</span>
          <span class="money num">${fmt(x.v)} ›</span></div>`;
      }).join(''));
  }
  else {
    const list = exp.filter(t=>t.big===drillBig && (drillSub? t.sub===drillSub : true)).sort((a,b)=>b.date.localeCompare(a.date));
    const hasSubs = (CATS['지출'][drillBig]||[]).length>0;
    const backLv = hasSubs && drillSub ? 2 : 1;
    const backLabel = backLv===2 ? `‹ ${drillBig}(으)로` : '‹ 전체 지출로';
    const crumb = drillSub ? `지출 › ${drillBig} › <b>${drillSub}</b>` : `지출 › <b>${drillBig}</b>`;
    el.innerHTML = `<span class="back" onclick="drillBack(${backLv})">${backLabel}</span>
      <div class="crumb">${crumb} — 거래 내역</div>` +
      (list.length===0 ? '<div class="empty">내역이 없어요</div>' :
      list.map(t=>`<div class="trow">
        <span class="l">${Number(t.date.slice(5,7))}/${Number(t.date.slice(8,10))} · ${t.memo||'(메모 없음)'}</span>
        <span class="money exp num">-${fmt(t.amount)}</span></div>`).join(''));
  }
}

/* ===== 예산 설정 ===== */
function renderBudgetSettings(){
  const el = document.getElementById('budgetSettings');
  el.innerHTML = EXP_BIGS.map(big=>{
    const v = state.budgets[big] ? Number(state.budgets[big]).toLocaleString() : '';
    return `<div class="setrow"><div class="nm">${big}</div>
      <input class="num budinput" data-big="${big}" value="${v}" placeholder="0" inputmode="numeric"><span class="won">원</span></div>`;
  }).join('');
  el.querySelectorAll('.budinput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const raw = e.target.value.replace(/[^0-9]/g,'');
      e.target.value = raw ? Number(raw).toLocaleString() : '';
    });
  });
}
function saveBudgets(){
  document.querySelectorAll('.budinput').forEach(inp=>{
    const v = Number(inp.value.replace(/[^0-9]/g,''));
    if(v>0) state.budgets[inp.dataset.big]=v;
    else delete state.budgets[inp.dataset.big];
  });
  persist();
  toast('예산을 저장했어요! ✓');
}

/* ===== 시작 ===== */
(function init(){
  const now = new Date();
  viewY = now.getFullYear(); viewM = now.getMonth()+1;
  document.getElementById('inDate').value = `${viewY}-${pad(viewM)}-${pad(now.getDate())}`;
  fillBig();
  loadState();
  renderAll();
})();
</script>
